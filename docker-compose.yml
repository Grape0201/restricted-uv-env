services:
  uv-mirror:
    build:
      context: ./deploy
      dockerfile: Dockerfile
    image: uv-mirror:latest
    container_name: uv-mirror
    restart: unless-stopped
    ports:
      # 公開ポート（環境変数 UV_MIRROR_PORT または .env で変更可能。未指定時は 80）
      - "${UV_MIRROR_PORT:-80}:80"
    volumes:
      # プロジェクト直下の mirror_data をコンテナ内にマウント
      # 別のディレクトリ（例: /var/www/uv-mirror）を使う場合は環境変数 UV_DATA_DIR で指定
      - "${UV_DATA_DIR:-./mirror_data}:/var/www/uv-mirror:ro"
