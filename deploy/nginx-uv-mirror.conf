# ==============================================================================
# 制限環境内 Linux Web サーバー用 Nginx 設定例
# 配置場所例: /etc/nginx/conf.d/uv-mirror.conf または /etc/nginx/sites-available/uv-mirror
# ==============================================================================

server {
    listen 80;
    # 制限環境内のサーバー名または IP アドレスに変更してください（"_" のままでもデフォルトとして動作します）
    server_name _;

    # rsync で同期された mirror_data の配置先ディレクトリ
    root /var/www/uv-mirror;

    # uv が flat インデックス (/wheels/) の一覧を取得するために autoindex on が必須です
    autoindex on;
    autoindex_exact_size on;
    autoindex_localtime on;
    charset utf-8;

    # 大容量の Python ランタイムや Wheel 配信の高速化設定
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    location / {
        try_files $uri $uri/ =404;
    }

    # キャッシュ制御（version.txt と wheels/ のディレクトリ一覧は常に最新を返す）
    location = /uv/version.txt {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /uv/latest/version.txt {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /wheels/ {
        # ディレクトリ一覧 HTML 自体はキャッシュせず、個別 .whl はキャッシュ可能にする
        add_header Cache-Control "no-cache";
    }
}
